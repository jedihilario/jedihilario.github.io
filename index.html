<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal website with some links to my social media profiles and contact tags.">
    <title>Hilario Yáñez Bertola | Links Page</title>
    <link rel="stylesheet" href="./global.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
</head>
<body>
    <div id="vanta"></div>
    <main>
        <header>
            <img src="./img/profile.jpg" alt="Profile" class="logo">
            <h1 class="name">
                Hilario Yáñez Bertola
            </h1>
        </header>

        <ul>
            <li>
                <a href="https://github.com/jedihilario" target="_blank">
                    <img src="./img/github.svg" alt="Github" width="30">
                    Github
                </a>
            </li>
            <li>
                <a href="https://www.linkedin.com/in/hilario-y%C3%A1%C3%B1ez-bertola/" target="_blank">
                    <img src="./img/linkedin-big-logo.svg" alt="LinkedIn" width="30">
                    LinkedIn
                </a>
            </li>
            <li>
                <a href="https://medium.com/@hyanezbertola" target="_blank">
                    <img src="./img/medium.svg" alt="Medium" width="30">
                    Medium
                </a>
            </li>
        </ul>
    </main>

    <script src="./background.js"></script>
    <script>
        setTimeout(() => {
            document.querySelector('main').style.opacity = 1;
        }, 1000);
    </script>
</body>
</html>
